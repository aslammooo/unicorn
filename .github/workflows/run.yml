name: Keep Running

on:
  workflow_dispatch:

concurrency:
  group: keep-alive-group
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup and Start Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # 1. تحميل وتثبيت ngrok
          curl -sLok https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz
          sudo mv ngrok /usr/local/bin/
          
          # 2. ربط الـ Authtoken الخاص بحسابك (ضروري عشان الروابط الثابتة)
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          
          # 3. تشغيل ngrok في الخلفية مستخدماً رابطك الثابت
          ngrok http 8000 --url=https://profile-engulf-smoky.ngrok-free.dev &

      - name: Run script with time limit
        run: |
          timeout 20700 python server.py || true

      - name: Trigger next run (restart chain)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches \
            -d '{"ref":"${{ github.ref_name }}"}'
