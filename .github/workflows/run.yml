name: Keep Running

on:
  workflow_dispatch:

concurrency:
  group: keep-alive-group
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup and Start Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # 1. إضافة وتثبيت ngrok بالطريقة الرسمية المستقرة
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok
          
          # 2. ربط التوكن الخاص بحسابك لتفعيل الروابط الثابتة
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          
          # 3. تشغيل ngrok في الخلفية برابطك الثابت
          ngrok http 8000 --url=https://profile-engulf-smoky.ngrok-free.dev &

      - name: Run script with time limit
        run: |
          timeout 20700 python server.py || true

      - name: Trigger next run (restart chain)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches \
            -d '{"ref":"${{ github.ref_name }}"}'
